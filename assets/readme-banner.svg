<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Two independent paths for a two-way conversation</title>
  <desc id="desc">Dot speaks through BlackHole 2ch to Google Voice. Google Voice returns phone audio through BlackHole 16ch to dot.</desc>
  <rect width="1200" height="360" rx="20" fill="#f4f2ec"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="54" y="61" font-size="15" font-weight="600" letter-spacing="2" fill="#647069">THE AUDIO BRIDGE</text>
    <text x="54" y="109" font-size="35" font-weight="650" fill="#25352f">Two paths. One conversation.</text>
    <text x="54" y="138" font-size="17" fill="#627069">Separate directions keep each side from hearing its own output.</text>
    <rect x="54" y="183" width="236" height="124" rx="14" fill="#e1e9e2"/>
    <text x="79" y="226" font-size="25" font-weight="650" fill="#25352f">dot</text>
    <text x="79" y="252" font-size="16" fill="#52645a">Mac voice assistant</text>
    <text x="79" y="282" font-size="13" fill="#52645a">SYSTEM INPUT / OUTPUT</text>
    <rect x="907" y="183" width="239" height="124" rx="14" fill="#eadfd2"/>
    <text x="932" y="226" font-size="25" font-weight="650" fill="#45392d">Google Voice</text>
    <text x="932" y="252" font-size="16" fill="#72614e">Browser ↔ phone</text>
    <text x="932" y="282" font-size="13" fill="#72614e">EXPLICIT DEVICE SELECTIONS</text>
    <path d="M310 219 H878" stroke="#467969" stroke-width="3"/>
    <path d="M866 210 L880 219 L866 228" fill="none" stroke="#467969" stroke-width="3" stroke-linejoin="round"/>
    <path d="M878 278 H310" stroke="#a97745" stroke-width="3"/>
    <path d="M324 269 L310 278 L324 287" fill="none" stroke="#a97745" stroke-width="3" stroke-linejoin="round"/>
    <rect x="457" y="197" width="284" height="43" rx="21" fill="#f4f2ec"/>
    <text x="599" y="224" text-anchor="middle" font-size="18" font-weight="600" fill="#376452">BlackHole 2ch · assistant voice</text>
    <rect x="457" y="256" width="284" height="43" rx="21" fill="#f4f2ec"/>
    <text x="599" y="283" text-anchor="middle" font-size="18" font-weight="600" fill="#946334">BlackHole 16ch · phone audio</text>
    <text x="1146" y="338" text-anchor="end" font-size="12" letter-spacing="1" fill="#7b827a">EXPERIMENTAL · APPLE SILICON · BLACKHOLE 0.7.1</text>
  </g>
</svg>
